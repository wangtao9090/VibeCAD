<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 z" fill="#1f2937"/>
    </marker>
    <style>
      .title { font: 700 30px sans-serif; fill: #111827; }
      .label { font: 600 22px sans-serif; fill: #111827; }
      .dimtext { font: 20px sans-serif; fill: #111827; }
      .conflict { font: 700 21px sans-serif; fill: #b91c1c; }
      .object { fill: #eef2f7; stroke: #111827; stroke-width: 3; }
      .dim { fill: none; stroke: #374151; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ext { fill: none; stroke: #6b7280; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="1200" fill="white"/>
  <text x="600" y="60" text-anchor="middle" class="title">PLATE DRAWING — DIMENSION CONFLICT</text>
  <text x="600" y="110" text-anchor="middle" class="label">TOP VIEW</text>
  <rect x="220" y="210" width="600" height="360" class="object"/>

  <line x1="220" y1="570" x2="220" y2="670" class="ext"/>
  <line x1="820" y1="570" x2="820" y2="670" class="ext"/>
  <line x1="228" y1="640" x2="812" y2="640" class="dim"/>
  <rect x="480" y="620" width="80" height="34" fill="white"/>
  <text x="520" y="646" text-anchor="middle" class="dimtext">80</text>

  <line x1="220" y1="210" x2="135" y2="210" class="ext"/>
  <line x1="220" y1="570" x2="135" y2="570" class="ext"/>
  <line x1="155" y1="218" x2="155" y2="562" class="dim"/>
  <rect x="120" y="373" width="70" height="34" fill="white"/>
  <text x="155" y="399" text-anchor="middle" class="dimtext">50</text>

  <g transform="translate(220 760)">
    <rect x="0" y="0" width="760" height="230" rx="12" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
    <text x="380" y="52" text-anchor="middle" class="conflict">REVISION NOTE: OVERALL LENGTH = 75 mm</text>
    <text x="380" y="102" text-anchor="middle" class="dimtext">Drawing dimension above says overall length = 80 mm</text>
    <text x="380" y="152" text-anchor="middle" class="conflict">80 mm and 75 mm refer to the same overall edge</text>
    <text x="380" y="198" text-anchor="middle" class="dimtext">Correct outcome: request conflict resolution; do not choose one silently</text>
  </g>
</svg>
