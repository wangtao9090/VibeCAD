name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  lint-unit:
    # 当前产品只声明 Darwin。Linux/Windows 应在各自的原生应用数据、进程、
    # 文件能力与真实 FreeCAD 契约完成后再恢复完整门禁，不能静默降级安全边界。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q            # slow 默认跳过
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
  runtime-integration:
    needs: lint-unit
    # AgentApplication、文件能力边界和发布 runtime 当前只在 Darwin 上受支持。
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: install runtime + full real-machine suite
        env: { VIBECAD_RUN_INTEGRATION: "1" }
        # 全量 slow：A1/A2/A3 + 建模/视觉/特征/回滚契约（UndoMode 等修复的唯一 CI 防线）
        run: uv run pytest -m slow -v -s
