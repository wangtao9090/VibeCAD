name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  lint-unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q            # slow 默认跳过
      - run: npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
  windows-quality:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q -m "not slow"
  windows-reviewed-attestation:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: bind a fresh isolated reviewed-attestation home
        shell: pwsh
        run: |
          $runtimeHome = Join-Path $env:RUNNER_TEMP "vibecad-reviewed-attestation"
          if (Test-Path -LiteralPath $runtimeHome) { throw "runtime home already exists" }
          "VIBECAD_HOME=$runtimeHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: build and install the exact pull-request wheel
        shell: pwsh
        run: |
          $distributionRoot = Join-Path $env:RUNNER_TEMP "reviewed-attestation-dist"
          $bootstrapRoot = Join-Path $env:RUNNER_TEMP "reviewed-attestation-bootstrap"
          uv build --wheel --out-dir $distributionRoot
          if ($LASTEXITCODE -ne 0) { throw "wheel build failed" }
          $wheels = @(Get-ChildItem -LiteralPath $distributionRoot -Filter "*.whl" -File)
          if ($wheels.Count -ne 1) { throw "expected one wheel" }
          uv venv --python 3.12 $bootstrapRoot
          if ($LASTEXITCODE -ne 0) { throw "bootstrap creation failed" }
          $bootstrapPython = Join-Path $bootstrapRoot "Scripts\python.exe"
          uv pip install --python $bootstrapPython --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { throw "bootstrap install failed" }
          $env:VIBECAD_PIP_SPEC = $wheels[0].FullName
          & $bootstrapPython -I -c "from vibecad.runtime.installer import RuntimeInstaller; RuntimeInstaller().install()"
          if ($LASTEXITCODE -ne 0) { throw "managed runtime install failed" }
          $managedPython = & $bootstrapPython -I -c "from vibecad.runtime.paths import env_python_for, env_prefix; print(env_python_for(env_prefix()).resolve())"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $managedPython)) {
            throw "managed Python is unavailable"
          }
          "VIBECAD_MANAGED_FREECAD_PYTHON=$managedPython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: exact packaged reviewed-attestation gate
        shell: pwsh
        run: |
          $diagnostic = @'
          import importlib.util
          import sys

          import vibecad.execution.freecad_reviewed_verification_wave_d as wave_d

          original = wave_d._execute_wave_d_case

          def traced(freecad, case, challenge_sha256):
              descriptor = wave_d._DESCRIPTOR_BY_CASE_SHA256.get(case.case_sha256)
              label = case.case_id if descriptor is None else (
                  f"{descriptor.family_id}/{descriptor.operation_id}/{descriptor.facet.value}"
              )
              try:
                  return original(freecad, case, challenge_sha256)
              except BaseException as exc:
                  print(
                      "TRUSTED_WAVE_D_FAILURE "
                      f"case={label} type={type(exc).__module__}.{type(exc).__qualname__} "
                      f"code={getattr(exc, 'code', None)!r} path={getattr(exc, 'path', None)!r} "
                      f"detail={exc!r} documents={tuple(freecad.listDocuments())!r}",
                      file=sys.stderr,
                      flush=True,
                  )
                  raise

          wave_d._execute_wave_d_case = traced
          name = "vibecad_pr_attestation_generator"
          spec = importlib.util.spec_from_file_location(
              name,
              ".github/scripts/generate_freecad_reviewed_release_attestation.py",
          )
          module = importlib.util.module_from_spec(spec)
          sys.modules[name] = module
          spec.loader.exec_module(module)
          sys.argv = [sys.argv[0], "--check"]
          raise SystemExit(module.main())
          '@
          & $env:VIBECAD_MANAGED_FREECAD_PYTHON -I -c $diagnostic
          if ($LASTEXITCODE -ne 0) { throw "reviewed-attestation gate failed" }
  runtime-integration:
    needs: lint-unit
    # This job exercises the macOS managed-runtime path; Windows product quality is
    # covered independently by windows-quality and the release qualification matrix.
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      VIBECAD_RUN_INTEGRATION: "1"
    steps:
      - name: bind an isolated managed runtime
        run: printf 'VIBECAD_HOME=%s\n' "$RUNNER_TEMP/vibecad-pr-runtime" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: install and verify the current managed FreeCAD runtime
        env:
          VIBECAD_PIP_SPEC: ${{ github.workspace }}
        run: >-
          uv run --frozen python -c
          "from vibecad.runtime.installer import RuntimeInstaller;
          RuntimeInstaller().install()"
      - name: bind the test to the installed managed runtime
        run: |
          managed_python="$(uv run --frozen python -c \
            'from vibecad.runtime.paths import env_python_for, env_prefix; print(env_python_for(env_prefix()).resolve())')"
          echo "VIBECAD_MANAGED_FREECAD_PYTHON=$managed_python" >> "$GITHUB_ENV"
      - name: bind private FreeCAD process directories
        run: >-
          uv run --frozen python -c
          "from vibecad.runtime.status import freecad_process_environment;
          [print(f'{name}={value}') for name, value in
          sorted(freecad_process_environment().items())]"
          >> "$GITHUB_ENV"
      - name: current Agent-first real-machine gate
        run: >-
          uv run --frozen pytest -m slow -v -s
          tests/test_task_kernel_integration.py::test_real_agent_first_public_matrix_and_cross_process_review
          tests/test_task_kernel_integration.py::test_real_task_kernel_commits_verified_candidate
      - name: install the managed-runtime test runner
        run: >-
          uv pip install
          --python "$VIBECAD_MANAGED_FREECAD_PYTHON"
          pytest==9.0.3
      - name: current native and parametric FreeCAD gate
        run: >-
          "$VIBECAD_MANAGED_FREECAD_PYTHON" -m pytest -m slow -v -s
          tests/test_tools_modeling.py::test_native_cone_sphere_torus_create_save_and_reopen_real
          tests/test_program_executor.py::test_real_freecad_native_booleans_edit_reopen_and_export_step
          tests/test_program_executor.py::test_real_freecad_component_boolean_owner_root_reopen_and_export_step
          tests/test_parametric_compiler.py::test_real_native_pattern_features_compile_edit_and_reopen
          tests/test_parametric_compiler.py::test_real_additive_non_immediate_pattern_can_continue_modeling
          tests/test_parametric_compiler.py::test_real_reopen_rejects_forged_global_pattern_budget
          tests/test_parametric_compiler.py::test_real_native_surface_modifiers_compile_edit_and_reopen
          tests/test_parametric_compiler.py::test_real_surface_modifier_can_feed_part_edge_treatment_and_refresh
          tests/test_parametric_compiler.py::test_real_reopen_rejects_forged_surface_face_metadata
          tests/test_parametric_compiler.py::test_real_surface_modifier_limits_and_forged_reopen_budget_fail_closed
